<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Booking a call — Ronin Software</title>
    <meta http-equiv="refresh" content="3; url=https://calendar.app.google/qgeuEgLsCBFSgqoD9" />
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <p>Taking you to our calendar&hellip; If you are not redirected,
      <a href="https://calendar.app.google/qgeuEgLsCBFSgqoD9">continue here</a>.</p>
    <script>
      // The /dans pageview records automatically (with referrer + any UTM params).
      // Labeled conversion event — shows on Vercel Pro, harmless no-op otherwise.
      try { window.va('event', { name: 'book_call' }); } catch (e) {}
      // Let the analytics beacon send, then forward to Google Calendar.
      setTimeout(function () {
        window.location.replace('https://calendar.app.google/qgeuEgLsCBFSgqoD9');
      }, 600);
    </script>
  </body>
</html>
